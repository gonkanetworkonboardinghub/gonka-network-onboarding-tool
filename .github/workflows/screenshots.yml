# Screenshots for the website's Download page, taken on fresh GitHub machines
# (nothing personal on screen) while doing exactly what a new user does:
# find the terminal, paste the install command, run it, see the app open.
# Installs the PUBLISHED release from the public repo. Run by hand.
name: Website screenshots

on:
  workflow_dispatch:

env:
  APP: The Gonka Network Onboarding Tool

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Screen setup
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Capture helpers
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $helpers = @'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class W { [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r); [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int ht, bool r); public struct RECT { public int Left, Top, Right, Bottom; } }'
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png"); $g.Dispose(); $bmp.Dispose()
            "shot $name ($($b.Width)x$($b.Height))"
          }
          function Rect($proc) {
            $p = Get-Process -Name $proc -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
            if (-not $p) { return "no window for $proc" }
            $r = New-Object W+RECT; [W]::GetWindowRect($p.MainWindowHandle, [ref]$r) | Out-Null
            "$proc window: left=$($r.Left) top=$($r.Top) right=$($r.Right) bottom=$($r.Bottom)"
          }
          $wsh = New-Object -ComObject WScript.Shell
          '@
          Set-Content -Path shots\helpers.ps1 -Value $helpers

      - name: 1. Search the Start menu for PowerShell
        run: |
          . .\shots\helpers.ps1
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep 3
          $wsh.SendKeys('^{ESC}')
          Start-Sleep 3
          $wsh.SendKeys('powershell')
          Start-Sleep 5
          Shot "win-1-start-search"

      - name: 2. Open it and paste the command
        run: |
          . .\shots\helpers.ps1
          $wsh.SendKeys('~')
          Start-Sleep 6
          $p = Get-Process powershell | Where-Object { $_.MainWindowHandle -ne 0 } | Sort-Object StartTime | Select-Object -Last 1
          if ($p) {
            [W]::MoveWindow($p.MainWindowHandle, 160, 120, 1100, 620, $true) | Out-Null
            [W]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          } else { "no PowerShell window opened from the Start menu" }
          Start-Sleep 1
          $wsh.SendKeys('cd \~')
          Start-Sleep 1
          $wsh.SendKeys('cls~')
          Start-Sleep 2
          Set-Clipboard -Value 'irm https://raw.githubusercontent.com/gonkanetworkonboardinghub/gonka-host-setup/main/install.ps1 | iex'
          $wsh.SendKeys('^v')
          Start-Sleep 3
          Rect powershell
          Shot "win-2-pasted"

      - name: 3. Press Enter and let it install
        run: |
          . .\shots\helpers.ps1
          $wsh.SendKeys('~')
          $deadline = (Get-Date).AddMinutes(8)
          while ((Get-Date) -lt $deadline -and -not (Get-Process -Name $env:APP -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 })) { Start-Sleep 3 }
          Start-Sleep 15
          Rect $env:APP
          Shot "win-4-app-home"
          $app = Get-Process -Name $env:APP -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
          if ($app) { [W]::ShowWindow($app.MainWindowHandle, 6) | Out-Null }
          Start-Sleep 3
          Rect powershell
          Shot "win-3-done"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shots
          path: shots/*.png

  mac:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Write the scripted steps
        run: |
          mkdir -p shots
          cat > shots/prompt.txt <<'EOF'
          PROMPT='%~ %% '; clear
          EOF
          printf '%s' 'curl -fsSL https://raw.githubusercontent.com/gonkanetworkonboardinghub/gonka-host-setup/main/install.sh | bash' > shots/command.txt

      - name: 1. Spotlight search for Terminal
        run: |
          osascript -e 'tell application "System Events" to keystroke space using command down' || echo "keystroke blocked"
          sleep 2
          osascript -e 'tell application "System Events" to keystroke "Terminal"' || true
          sleep 4
          screencapture -x shots/mac-1-spotlight.png

      - name: 2. Open Terminal and paste the command
        run: |
          osascript -e 'tell application "System Events" to key code 36' || true
          sleep 6
          osascript -e 'tell application "Terminal" to activate' -e 'tell application "Terminal" to set bounds of front window to {260, 160, 1360, 760}' || true
          sleep 1
          sed -e 's/^ *//' shots/prompt.txt | tr -d '\n' | pbcopy
          osascript -e 'tell application "System Events" to keystroke "v" using command down' -e 'delay 0.5' -e 'tell application "System Events" to key code 36' || true
          sleep 2
          pbcopy < shots/command.txt
          osascript -e 'tell application "System Events" to keystroke "v" using command down' || true
          sleep 3
          screencapture -x shots/mac-2-pasted.png

      - name: 3. Press Enter and let it install
        run: |
          osascript -e 'tell application "System Events" to key code 36' || true
          for i in $(seq 1 160); do pgrep -f "$APP.app/Contents/MacOS/" >/dev/null && break; sleep 3; done
          sleep 15
          screencapture -x shots/mac-4-app-home.png
          osascript -e 'tell application "System Events" to keystroke "m" using command down' || true
          sleep 3
          osascript -e 'tell application "Terminal" to activate' || true
          sleep 2
          screencapture -x shots/mac-3-done.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-shots
          path: shots/*.png
