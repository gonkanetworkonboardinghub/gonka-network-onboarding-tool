# Screenshots of the app for the website and announcements, taken on a fresh
# GitHub Windows machine (nothing personal on screen). Installs the PUBLISHED
# release with the real one-line command, then captures the home screen and
# Gonka Host Setup's first step with live network data. Run by hand.
name: App screenshots

on:
  workflow_dispatch:

env:
  APP: The Gonka Network Onboarding Tool

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Screen setup
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Capture helpers
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $helpers = @'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class W { [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e); public struct RECT { public int Left, Top, Right, Bottom; } }'
          function AppWindow {
            Get-Process -Name $env:APP -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
          }
          # Saves just the app window (inside Windows 11's invisible 8px borders).
          function ShotApp($name) {
            $p = AppWindow
            if (-not $p) { "no app window"; return }
            [W]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
            Start-Sleep 1
            $r = New-Object W+RECT; [W]::GetWindowRect($p.MainWindowHandle, [ref]$r) | Out-Null
            $x = $r.Left + 8; $y = $r.Top + 1; $w = ($r.Right - 8) - $x; $h = ($r.Bottom - 8) - $y
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($x, $y, 0, 0, $bmp.Size)
            $bmp.Save("shots\$name.png"); $g.Dispose(); $bmp.Dispose()
            "shot $name ${w}x${h} at $x,$y"
          }
          function ClickInApp($dx, $dy) {
            $p = AppWindow
            $r = New-Object W+RECT; [W]::GetWindowRect($p.MainWindowHandle, [ref]$r) | Out-Null
            [W]::SetCursorPos($r.Left + 8 + $dx, $r.Top + 1 + $dy) | Out-Null
            Start-Sleep -Milliseconds 300
            [W]::mouse_event(2, 0, 0, 0, 0); [W]::mouse_event(4, 0, 0, 0, 0)
            [W]::SetCursorPos(5, 5) | Out-Null
          }
          '@
          Set-Content -Path shots\helpers.ps1 -Value $helpers

      - name: Install with the one-line command, like a new user
        run: |
          powershell.exe -NoProfile -Command "irm https://raw.githubusercontent.com/gonkanetworkonboardinghub/gonka-host-setup/main/install.ps1 | iex"
          . .\shots\helpers.ps1
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline -and -not (AppWindow)) { Start-Sleep 3 }
          Start-Sleep 15

      - name: Home screen
        run: |
          . .\shots\helpers.ps1
          ShotApp "app-1-home"

      - name: Gonka Host Setup, first step with live network data
        run: |
          . .\shots\helpers.ps1
          ClickInApp 245 330
          Start-Sleep 20
          ShotApp "app-2-host-setup"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-shots
          path: shots/*.png
